services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    labels:
      - "autoheal=true"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data/ml_models:/app/app/ml/models
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Docker allein startet einen Container NICHT neu, nur weil sein
  # HEALTHCHECK "unhealthy" meldet (siehe backend/Dockerfile) - autoheal
  # beobachtet den Health-Status per Docker-Socket und stößt den Neustart
  # an. Notwendig geworden, weil der Backend-Prozess am 2026-09-28 nach
  # einem DNS-Ausfall zwei Stunden lang still eingefroren ist, ohne dass
  # der Container das selbst gemerkt/gemeldet hätte.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

# Bewusst Bind-Mounts statt benannter Docker-Volumes (./data/…, ./mosquitto/…):
# alles liegt sichtbar unter dem Projektordner, damit eine Synology-Sicherung
# (Hyper Backup / Snapshot Replication) den ganzen Ordner in einem Stück
# sichern kann, statt in die interne Docker-Volume-Verwaltung greifen zu
# müssen. Siehe sensir.md Abschnitt 8 für die empfohlene Ordnerstruktur.
